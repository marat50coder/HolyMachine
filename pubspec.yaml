name: holy_machine_mex
description: "Holy Machine - casino slot game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/Holy_Machine_additional_assets/
    - assets/Holy_Machine_gameplay_assets/

flutter_launcher_icons:
  # Only the legacy pre-API-26 mipmaps are generated here. The adaptive icon in
  # mipmap-anydpi-v26 is hand-written so the system draws the artwork with a
  # safe inset exactly as on SkyLadder.
  android: true
  ios: false
  image_path: "assets/Holy_Machine_additional_assets/Icon.webp"
  min_sdk_android: 24
